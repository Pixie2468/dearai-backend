name: Deploy to GCP

on:
  push:
    branches:
      - main

# Add permissions required for Workload Identity Federation
permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_REGION: ${{ secrets.GCP_REGION }}
  ARTIFACT_REPO: dear-ai-repo
  AI_SERVICE_IMAGE: ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/dear-ai-repo/ai-service
  AGENT_SERVICE_IMAGE: ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/dear-ai-repo/agent-service
  CHAT_SERVICE_IMAGE: ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/dear-ai-repo/chat-service
  DIARY_SERVICE_IMAGE: ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/dear-ai-repo/diary-service
  GATEWAY_IMAGE: ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/dear-ai-repo/gateway

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Google Auth (Workload Identity Federation)
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Docker Auth
        run: |-
          gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      # --- AI SERVICE ---
      - name: Build AI Service Image
        run: docker build -t ${{ env.AI_SERVICE_IMAGE }}:${{ github.sha }} ./ai-service
        
      - name: Push AI Service Image
        run: docker push ${{ env.AI_SERVICE_IMAGE }}:${{ github.sha }}

      - name: Deploy AI Service to Cloud Run
        id: deploy-ai
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: dear-ai-ai-service
          region: ${{ env.GCP_REGION }}
          image: ${{ env.AI_SERVICE_IMAGE }}:${{ github.sha }}
          flags: |
            --network=default
            --subnet=default
            --vpc-egress=private-ranges-only
            --port=8001
            --allow-unauthenticated
          env_vars: |
            ENV=production
            PASETO_SYMMETRIC_KEY=${{ secrets.PASETO_SYMMETRIC_KEY }}
            FALKORDB_HOST=${{ secrets.FALKORDB_HOST }}
            FALKORDB_PORT=6379
            FALKORDB_PASSWORD=${{ secrets.FALKORDB_PASSWORD }}
            VERTEX_MODEL_ID=5821184543108890624
            VERTEX_PROJECT=${{ secrets.GCP_PROJECT_ID }}
            VERTEX_LOCATION=us-central1
            EMBEDDING_MODEL=text-embedding-004
            DEEPGRAM_API_KEY=${{ secrets.DEEPGRAM_API_KEY }}

      # --- AGENT SERVICE ---
      - name: Build Agent Service Image
        run: docker build -t ${{ env.AGENT_SERVICE_IMAGE }}:${{ github.sha }} ./agent-service
        
      - name: Push Agent Service Image
        run: docker push ${{ env.AGENT_SERVICE_IMAGE }}:${{ github.sha }}

      - name: Deploy Agent Service to Cloud Run
        id: deploy-agent
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: dear-ai-agent-service
          region: ${{ env.GCP_REGION }}
          image: ${{ env.AGENT_SERVICE_IMAGE }}:${{ github.sha }}
          flags: |
            --network=default
            --subnet=default
            --vpc-egress=private-ranges-only
            --port=8002
            --allow-unauthenticated
          env_vars: |
            ENV=production
            PASETO_SYMMETRIC_KEY=${{ secrets.PASETO_SYMMETRIC_KEY }}
            VERTEX_GENERATION_MODEL=gemini-3.1-flash
            VERTEX_PROJECT=${{ secrets.GCP_PROJECT_ID }}
            VERTEX_LOCATION=${{ env.GCP_REGION }}

      # --- CHAT SERVICE ---
      - name: Build Chat Service Image
        run: docker build -t ${{ env.CHAT_SERVICE_IMAGE }}:${{ github.sha }} ./chat-service
        
      - name: Push Chat Service Image
        run: docker push ${{ env.CHAT_SERVICE_IMAGE }}:${{ github.sha }}

      - name: Deploy Chat Service to Cloud Run
        id: deploy-chat
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: dear-ai-chat-service
          region: ${{ env.GCP_REGION }}
          image: ${{ env.CHAT_SERVICE_IMAGE }}:${{ github.sha }}
          flags: |
            --network=default
            --subnet=default
            --vpc-egress=private-ranges-only
            --port=8003
            --allow-unauthenticated
          env_vars: |
            ENV=production
            PASETO_SYMMETRIC_KEY=${{ secrets.PASETO_SYMMETRIC_KEY }}
            DATABASE_URL=${{ secrets.CHAT_DATABASE_URL }}

      # --- DIARY SERVICE ---
      - name: Build Diary Service Image
        run: docker build -t ${{ env.DIARY_SERVICE_IMAGE }}:${{ github.sha }} ./diary-service
        
      - name: Push Diary Service Image
        run: docker push ${{ env.DIARY_SERVICE_IMAGE }}:${{ github.sha }}

      - name: Deploy Diary Service to Cloud Run
        id: deploy-diary
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: dear-ai-diary-service
          region: ${{ env.GCP_REGION }}
          image: ${{ env.DIARY_SERVICE_IMAGE }}:${{ github.sha }}
          flags: |
            --network=default
            --subnet=default
            --vpc-egress=private-ranges-only
            --port=8004
            --allow-unauthenticated
          env_vars: |
            ENV=production
            PASETO_SYMMETRIC_KEY=${{ secrets.PASETO_SYMMETRIC_KEY }}
            DATABASE_URL=${{ secrets.DIARY_DATABASE_URL }}

      # --- GATEWAY ---
      - name: Build Gateway Image
        run: docker build -t ${{ env.GATEWAY_IMAGE }}:${{ github.sha }} ./gateway
        
      - name: Push Gateway Image
        run: docker push ${{ env.GATEWAY_IMAGE }}:${{ github.sha }}

      - name: Get Backend URLs
        id: get-backend-urls
        run: |
          AI_URL=${{ steps.deploy-ai.outputs.url }}
          # Convert https:// to wss://
          WS_URL=$(echo $AI_URL | sed 's/https:\/\//wss:\/\//')
          echo "BACKEND_WS=$WS_URL" >> $GITHUB_ENV
          
          AGENT_URL=${{ steps.deploy-agent.outputs.url }}
          echo "AGENT_SERVICE_URL=$AGENT_URL" >> $GITHUB_ENV
          
          CHAT_URL=${{ steps.deploy-chat.outputs.url }}
          echo "CHAT_SERVICE_URL=$CHAT_URL" >> $GITHUB_ENV
          
          DIARY_URL=${{ steps.deploy-diary.outputs.url }}
          echo "DIARY_SERVICE_URL=$DIARY_URL" >> $GITHUB_ENV

      - name: Deploy Gateway to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: dear-ai-gateway
          region: ${{ env.GCP_REGION }}
          image: ${{ env.GATEWAY_IMAGE }}:${{ github.sha }}
          flags: |
            --allow-unauthenticated
          env_vars: |
            ENV=production
            ALLOWED_ORIGINS=*
            BACKEND_WS=${{ env.BACKEND_WS }}
            AGENT_SERVICE_URL=${{ env.AGENT_SERVICE_URL }}
            CHAT_SERVICE_URL=${{ env.CHAT_SERVICE_URL }}
            DIARY_SERVICE_URL=${{ env.DIARY_SERVICE_URL }}
            PASETO_SYMMETRIC_KEY=${{ secrets.PASETO_SYMMETRIC_KEY }}
            OIDC_ISSUER=https://securetoken.google.com/dear-ai-485310
            OIDC_CLIENT_ID=dear-ai-485310
