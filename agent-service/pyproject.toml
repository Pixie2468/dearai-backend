[project]
name = "agent-service"
version = "0.1.0"
description = "Agent service for Dear AI"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "fastapi[standard]>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "python-dotenv>=1.0,<2.0",
    "httpx>=0.27,<1.0",
    "google-cloud-aiplatform>=1.60,<2.0",
    "google-auth>=2.30,<3.0",
    "pyseto>=1.9.3",
    "langgraph>=0.2.14",
    "langchain-google-genai>=1.0.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
