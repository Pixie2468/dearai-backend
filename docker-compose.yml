services:
  # ────────────────────────────────────────────────
  # Application Services
  # ────────────────────────────────────────────────
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: dear-ai-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - ./gateway/.env
    depends_on:
      ai_service:
        condition: service_healthy
      chat_service:
        condition: service_healthy
      diary_service:
        condition: service_healthy
    networks:
      - dear-ai-internal

  ai_service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: dear-ai-ai-service
    restart: unless-stopped
    expose:
      - "8000"
    env_file:
      - ./ai-service/.env
    # 1. Mount your local host's ADC file into the container securely (read-only)
    volumes:
      - /home/darsh/.config/gcloud/application_default_credentials.json:/tmp/keys/adc.json:ro,z
    # 2. Tell the Google Cloud SDK exactly where to find it inside the container
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/tmp/keys/adc.json
      - HF_HOME=/tmp/huggingface
      - XDG_CACHE_HOME=/tmp
      - CHAT_SERVICE_URL=http://chat_service:8000
    depends_on:
      falkordb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - dear-ai-internal

  chat_service:
    build:
      context: ./chat-service
      dockerfile: Dockerfile
    container_name: dear-ai-chat-service
    restart: unless-stopped
    expose:
      - "8000"
    env_file:
      - ./chat-service/.env
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/postgres
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/docs')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - dear-ai-internal

  diary_service:
    build:
      context: ./diary-service
      dockerfile: Dockerfile
    container_name: dear-ai-diary-service
    restart: unless-stopped
    expose:
      - "8000"
    env_file:
      - ./diary-service/.env
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/postgres
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/docs')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - dear-ai-internal

  # ────────────────────────────────────────────────
  # Infrastructure
  # ────────────────────────────────────────────────
  postgres:
    image: postgres:15
    container_name: dear-ai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - dear-ai-internal

  falkordb:
    image: falkordb/falkordb:latest
    container_name: dear-ai-falkordb
    restart: unless-stopped
    # Exposed to host for local inspection / development tooling only.
    # Remove in production deployments.
    ports:
      - "6379:6379"
    volumes:
      - falkor_dearai:/data
    command: >
      falkordb-server
      --save 60 1
      --loglevel notice
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - dear-ai-internal

networks:
  dear-ai-internal:
    driver: bridge

volumes:
  falkor_dearai:
  postgres_data:
